[tool.poetry]
name = "norma"
version = "0.1.0"
description = "The Operating System for Your AI Agents — governance, enforcement, and analytics for LLM-powered multi-agent systems."
authors = ["norma.ai"]
readme = "../README.md"
packages = [{ include = "norma" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
aiosqlite = "^0.20.0"          # async SQLite driver
asyncpg = "^0.30.0"            # async Postgres driver
psycopg2-binary = "^2.9.9"     # sync Postgres driver (sync callbacks)

# Pydantic / settings
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# LLM + agent runtime
openai = ">=1.54.0"
langchain = ">=0.3.0"
langchain-openai = ">=0.2.0"
langgraph = ">=0.2.0"
openai-agents = ">=0.10.0"

# YAML contract parsing
pyyaml = "^6.0"
jsonschema = "^4.23.0"

# Utilities
python-dotenv = "^1.0.0"
structlog = "^24.4.0"
httpx = "^0.27.0"               # async HTTP client
rich = "^13.8.0"                # pretty CLI output (seed script, debug)
click = "^8.1.0"                # CLI commands
fpdf2 = "^2.8.2"                # compliance PDF export
norma-client = {path = "../lib/norma_client"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"               # TestClient
ruff = "^0.7.0"
mypy = "^1.12.0"
types-pyyaml = "^6.0"

[tool.poetry.scripts]
norma          = "norma.integrations.cli:norma_cmd"
norma-import   = "norma.integrations.cli:import_cmd"
norma-watch    = "norma.integrations.watch:watch_cmd"
norma-generate = "norma.core.contract_generator:generate_cmd"
norma-onboard  = "norma.agents.introspect:onboard_cmd"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
